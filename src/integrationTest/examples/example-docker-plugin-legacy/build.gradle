plugins {
    id 'eu.xenit.docker'
    id 'eu.xenit.docker-compose'
}

dockerFile {
    dockerFile = file('Dockerfile')
    dockerBuild {
        repository = 'example-docker-plugin'
        tags = ['1', '1.0', 'test', "1${"Gstring"}"]
    }
}

tasks.register('beforeBuild') {
    doLast {
        println "This runs before build"
    }

}

tasks.named('buildDockerImage') {
    dependsOn(tasks.named('beforeBuild'))
}

// Remove this when using the plugin
tasks.register('integrationTest') {
}

dockerCompose.isRequiredBy(tasks.named('integrationTest'))
