plugins {
    id 'eu.xenit.docker-config'
}

repositories {
    mavenCentral()
    maven {
        url = "https://artifacts.alfresco.com/nexus/content/groups/public/"
    }
}


import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import eu.xenit.gradle.docker.alfresco.tasks.*

configurations {
    baseAlfrescoWar
    alfrescoAmp
}

dependencies {
    baseAlfrescoWar "org.alfresco:content-services-community:6.0.a@war"
    alfrescoAmp "de.fmaul:javascript-console-repo:0.6@amp"
}

tasks.register('applyAmps', InstallAmpsInWarTask) {
    inputWar = configurations.baseAlfrescoWar
    sourceFiles = configurations.alfrescoAmp
}

tasks.create('createDockerFile', DockerfileWithWarsTask) {
    baseImage = "tomcat:7-jre8"
    addWar("alfresco", tasks.named('applyAmps').get().outputWar)
    withLabels(tasks.named('applyAmps').get())
}

tasks.register('buildDockerImage', DockerBuildImage) {
    dependsOn tasks.named('createDockerFile')
    inputDir.set(tasks.named('createDockerFile').get().destFile.asFile.get().parentFile)
    dockerFile.set(tasks.named('createDockerFile').get().destFile)
}
