plugins {
    id "eu.xenit.docker-alfresco"
}


repositories {
    mavenCentral()
    maven {
        url = "https://artifacts.alfresco.com/nexus/content/groups/public/"
    }
}

dependencies {
    baseAlfrescoWar "org.alfresco:content-services-community:6.0.7-ga@war"
}

prefixAlfrescoLog4j {
    enabled = false
}

dockerBuild {
    alfresco {
        baseImage = "tomcat:7-jre8"
    }
}

// Check if no log4j changes are applied
import com.bmuschko.gradle.docker.tasks.container.*

tasks.register('createContainer', DockerCreateContainer) {
    imageId = buildDockerImage.imageId
    // Just run a command so the container stays active in the background without starting Alfresco
    cmd = ["bash", "-c", "while true; do sleep 100; done"]
    dependsOn(buildDockerImage)
    hostConfig.autoRemove = true
}

tasks.register('startContainer', DockerStartContainer) {
    containerId = tasks.named('createContainer').get().containerId
    dependsOn(tasks.named('createContainer'))
}

tasks.register('checkDefaultLog4J', DockerExecContainer) {
    containerId = tasks.named('createContainer').get().containerId
    withCommand(["fgrep", "File", "/usr/local/tomcat/webapps/alfresco/WEB-INF/classes/log4j.properties"])
    successOnExitCodes.add(0)
    dependsOn(tasks.named('startContainer'))
}

tasks.register('terminateContainer', DockerKillContainer) {
    containerId = tasks.named('createContainer').get().containerId
    dependsOn(tasks.named('createContainer'))
}

tasks.register('functionalTest') {
    dependsOn(tasks.named('checkDefaultLog4J'))
    finalizedBy(tasks.named('terminateContainer'))
}
